[package]
name = "luma"
version = "0.1.0"
description = "Luma desktop app"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
getrandom = "0.3"
url = "2"
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Registry", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
