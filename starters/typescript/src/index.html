<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luma starter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="surface" id="surface" data-state="busy">
      <header class="masthead">
        <p class="package">Plugin starter</p>
        <h1 id="greeting">Hello from Luma</h1>
      </header>

      <p class="status" id="status" role="status">Starting the package surface.</p>

      <div class="actions">
        <button type="button" id="refresh" class="primary">Refresh greeting</button>
        <button type="button" id="close">Close</button>
      </div>

      <footer class="footer">
        <p class="identity" id="identity"></p>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
